name: ci

on:
  push:
    branches:
      - develop
      - main
      - v2
  pull_request:
    branches:
      - develop
      - main
      - v2

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Required so auto-commit can push back to the PR branch.
          ref: ${{ github.head_ref || github.ref_name }}
          # PAT so the quality push re-triggers CI without "Approve workflows".
          # GITHUB_TOKEN pushes leave pull_request runs in an approval-required state.
          # Falls back for fork PRs (secrets unavailable) — commit step already continue-on-error.
          token: ${{ secrets.CI_PUSH_TOKEN || github.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Rector first, Pint second — Pint owns formatting so the pair stays idempotent.
      - name: Apply PHP quality fixes (Rector → Pint)
        run: composer quality-fix

      - name: Apply frontend quality fixes (ESLint → Prettier)
        run: |
          npm run lint
          npm run format

      - name: Commit quality fixes
        id: quality_commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Apply CI quality fixes
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
        # Fork PRs cannot push unless "Allow edits by maintainers" is enabled.
        continue-on-error: true

      - name: Analyse PHP (PHPStan, advisory)
        run: composer analyse
        continue-on-error: true

      - name: Typecheck frontend (advisory)
        run: npm run typecheck
        continue-on-error: true

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v5
        with:
          # Prefer branch tip so we pick up any quality auto-commit from the previous job.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: |
          cp .env.example .env
          # .env.example defaults to Sail (DB_HOST=mysql). CI has no Compose network — use SQLite.
          sed -i \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' \
            -e 's/^DB_HOST=.*/# DB_HOST=127.0.0.1/' \
            -e 's/^DB_PORT=.*/# DB_PORT=3306/' \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=database\/database.sqlite/' \
            -e 's/^DB_USERNAME=.*/# DB_USERNAME=/' \
            -e 's/^DB_PASSWORD=.*/# DB_PASSWORD=/' \
            -e 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' \
            -e 's/^MAIL_HOST=.*/MAIL_HOST=127.0.0.1/' \
            -e 's/^MAIL_PORT=.*/MAIL_PORT=2525/' \
            .env
          touch database/database.sqlite

      - name: Generate application key
        run: php artisan key:generate

      - name: Publish Ziggy configuration
        run: php artisan ziggy:generate

      - name: Build assets
        run: npm run build

      - name: Frontend unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Prepare e2e database
        run: php artisan migrate:fresh --seed --seeder=E2eSeeder --force

      - name: End-to-end tests
        env:
          PHP_CLI_SERVER_WORKERS: 1
          PLAYWRIGHT_SKIP_DB_SETUP: 1
        run: npm run test:e2e

      - name: PHPUnit
        run: ./vendor/bin/phpunit

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2')
    environment: production
    steps:
      - name: Trigger Laravel Cloud deployment
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [[ -z "${DEPLOY_HOOK}" ]]; then
            echo "LARAVEL_CLOUD_DEPLOY_HOOK is not configured."
            echo "Disable Laravel Cloud push-to-deploy and add this secret to gate deployments on CI."
            exit 0
          fi

          curl --fail --silent --show-error \
            -X POST "${DEPLOY_HOOK}?commit_hash=${GITHUB_SHA}"
